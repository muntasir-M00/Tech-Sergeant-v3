<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TechSarge | Video Tutorials</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="text-zinc-100 bg-[#0f0f11] min-h-screen circuit-bg" style="font-family:'Inter',system-ui,sans-serif">

  <!-- TopNavBar -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 md:px-8 h-16 bg-[#0f0f11]/90 backdrop-blur-xl border-b border-white/8">
    <a href="index.html" class="flex items-center gap-2.5">
      <div class="relative flex items-center justify-center w-9 h-9 bg-white/5 rounded-lg border border-white/10">
        <span class="text-xl font-black tracking-tighter monogram-t">T</span>
        <span class="text-xl font-black tracking-tighter monogram-s" style="margin-left:-3px">S<div class="monogram-glow"></div></span>
      </div>
      <span class="text-lg font-extrabold tracking-tight">
        <span class="text-white">Tech</span>
        <span class="text-cyan-400">Sargeant</span>
      </span>
    </a>
    <nav class="hidden md:flex items-center gap-6">
      <a data-nav="home" data-nav-style="top" href="index.html" class="ts-topnav-link">Home</a>
      <a data-nav="ai" data-nav-style="top" href="ai.html" class="ts-topnav-link">AI Diagnostics</a>
      <a data-nav="videos" data-nav-style="top" href="videos.html" class="ts-topnav-link">Video Tutorials</a>
      <a data-nav="osdownload" data-nav-style="top" href="osdownload.html" class="ts-topnav-link">OS Center</a>
      <a data-nav="repair" data-nav-style="top" href="repair.html" class="ts-topnav-link">Repair Store</a>
    </nav>
    <div class="flex items-center gap-3">
      <button id="ts-menu-toggle" class="ts-menu-toggle" title="Menu">
        <span class="material-symbols-outlined" style="font-size:20px">menu</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="ts-main px-4 md:px-8 pb-16 min-h-screen">
    <div class="max-w-screen-xl mx-auto">

      <!-- Hero -->
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
        <div>
          <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">// Mission Archives</p>
          <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">Video Tutorials</h1>
          <p class="text-zinc-400 text-sm max-w-2xl mt-2 leading-relaxed">High-fidelity technical documentaries and repair masterclasses. Like, comment, and share your favourites.</p>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 glass-panel rounded-full border border-cyan-400/15">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Session: Active</span>
          <span class="text-zinc-500 text-xs ml-2">TS-992-ALPHA</span>
        </div>
      </div>

      <!-- Video Grid (rendered from Storage) -->
      <div id="ts-video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- populated dynamically -->
      </div>
    </div>
  </main>

  <!-- Comment Modal -->
  <div id="ts-comment-modal-backdrop" class="ts-modal-backdrop" style="z-index:160">
    <div class="ts-modal" style="max-width:480px">
      <h3 id="ts-comment-modal-title">Comments</h3>
      <div id="ts-comment-modal-list" class="space-y-3 max-h-64 overflow-y-auto custom-scrollbar mb-4"></div>
      <div class="flex gap-3">
        <input id="ts-comment-input" type="text" placeholder="Write a comment..." class="flex-1 bg-[#0f0f11] border border-white/10 text-zinc-100 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-cyan-400 transition-colors" />
        <button id="ts-comment-submit" class="px-4 bg-cyan-400 text-zinc-950 font-bold text-sm rounded-lg hover:bg-cyan-300 transition-colors">Post</button>
      </div>
      <div class="ts-modal-actions mt-4">
        <button class="secondary" onclick="document.getElementById('ts-comment-modal-backdrop').classList.remove('show')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function fmtNum(n) {
      if (!n) return '0';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
    }

    const likedVideos = new Set(JSON.parse(localStorage.getItem('techsarge:liked') || '[]'));

    function saveLiked() {
      localStorage.setItem('techsarge:liked', JSON.stringify([...likedVideos]));
    }

    let activeCommentVideoId = null;

    function openCommentModal(videoId) {
      activeCommentVideoId = videoId;
      const v = Storage.videos.get(videoId);
      if (!v) return;
      document.getElementById('ts-comment-modal-title').textContent = `Comments · ${v.title}`;
      document.getElementById('ts-comment-input').value = '';
      renderCommentList(v.comments || []);
      document.getElementById('ts-comment-modal-backdrop').classList.add('show');
    }

    function renderCommentList(comments) {
      const list = document.getElementById('ts-comment-modal-list');
      if (comments.length === 0) {
        list.innerHTML = '<p class="text-zinc-500 text-sm py-2">No comments yet. Be the first!</p>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="bg-white/4 rounded-xl p-3 border border-white/6">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-bold text-cyan-400 uppercase tracking-wide">${escHtml(c.author)}</span>
            <span class="text-[10px] text-zinc-600">${formatTime(c.ts)}</span>
          </div>
          <p class="text-sm text-zinc-300 leading-relaxed">${escHtml(c.text)}</p>
        </div>
      `).join('');
    }

    document.getElementById('ts-comment-submit').addEventListener('click', () => {
      if (!activeCommentVideoId) return;
      const input = document.getElementById('ts-comment-input');
      const text = input.value.trim();
      if (!text) return;
      Storage.videos.addComment(activeCommentVideoId, 'Viewer', text);
      input.value = '';
      const v = Storage.videos.get(activeCommentVideoId);
      if (v) renderCommentList(v.comments || []);
      const countEl = document.getElementById('ts-comment-count-' + activeCommentVideoId);
      if (countEl) {
        const v2 = Storage.videos.get(activeCommentVideoId);
        countEl.textContent = fmtNum((v2.comments || []).length);
      }
    });

    document.getElementById('ts-comment-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('ts-comment-submit').click();
    });

    function renderVideos() {
      const grid = document.getElementById('ts-video-grid');
      const videos = Storage.videos.list().filter(v => v.active);
      if (videos.length === 0) {
        grid.innerHTML = `<div class="col-span-full glass-panel p-12 rounded-2xl text-center border border-white/8"><p class="text-zinc-500">No active video tutorials.</p></div>`;
        return;
      }

      grid.innerHTML = videos.map(v => {
        const isLiked = likedVideos.has(v.id);
        const videoId = v.id;
        const embedUrl = v.url
          ? v.url.replace('youtube.com/watch?v=', 'youtube.com/embed/').replace('youtu.be/', 'youtube.com/embed/')
          : '';
        return `
        <div class="glass-panel rounded-2xl overflow-hidden border border-white/8 hover:border-white/15 transition-all duration-300 flex flex-col" id="vc-${videoId}">
          <!-- Thumbnail + Play -->
          <div class="relative aspect-video bg-zinc-900 overflow-hidden group cursor-pointer" id="thumb-${videoId}" data-url="${escHtml(v.url)}" data-embed="${escHtml(embedUrl)}">
            <img alt="${escHtml(v.title)}" class="w-full h-full object-cover opacity-70 group-hover:scale-105 transition-transform duration-500" src="${escHtml(v.thumbnail)}" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-14 h-14 rounded-full bg-black/50 border border-white/20 flex items-center justify-center backdrop-blur-sm group-hover:bg-cyan-400/20 group-hover:border-cyan-400/50 transition-all">
                <span class="material-symbols-outlined text-white" style="font-size:28px;margin-left:3px">play_arrow</span>
              </div>
            </div>
            ${v.duration ? `<div class="absolute bottom-2 right-2 bg-black/80 px-2 py-0.5 rounded text-[10px] font-mono text-cyan-400 border border-cyan-400/20">${escHtml(v.duration)}</div>` : ''}
            <div class="absolute top-2 left-2 flex items-center gap-1 bg-black/70 px-2 py-0.5 rounded">
              <span class="material-symbols-outlined text-zinc-400" style="font-size:12px">visibility</span>
              <span class="text-[10px] text-zinc-400 font-bold" id="ts-view-${videoId}">${fmtNum(v.views)}</span>
            </div>
          </div>

          <!-- Info -->
          <div class="p-4 flex-1 flex flex-col">
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="font-bold text-base text-white leading-tight">${escHtml(v.title)}</h3>
              <span class="material-symbols-outlined text-zinc-600 shrink-0" style="font-size:18px">verified</span>
            </div>
            <p class="text-sm text-zinc-500 leading-relaxed mb-3 flex-1 line-clamp-2">${escHtml(v.description || '')}</p>
            <div class="flex gap-1.5 flex-wrap mb-3">
              ${(v.tags || []).map(t => `<span class="px-2 py-0.5 bg-cyan-400/8 text-[10px] font-bold text-cyan-400 rounded border border-cyan-400/15 uppercase tracking-widest">${escHtml(t)}</span>`).join('')}
            </div>
          </div>

          <!-- Like / Comment / Share -->
          <div class="ts-video-actions">
            <button class="ts-action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${videoId}" onclick="handleLike('${videoId}')">
              <span class="material-symbols-outlined" style="font-variation-settings:'FILL' ${isLiked ? 1 : 0}">favorite</span>
              <span id="like-count-${videoId}">${fmtNum(v.likes || 0)}</span>
            </button>
            <button class="ts-action-btn" onclick="openCommentModal('${videoId}')">
              <span class="material-symbols-outlined">chat_bubble</span>
              <span id="ts-comment-count-${videoId}">${fmtNum((v.comments || []).length)}</span>
            </button>
            <button class="ts-action-btn" onclick="handleShare('${videoId}','${escHtml(v.title)}','${escHtml(v.url)}')">
              <span class="material-symbols-outlined">share</span>
              Share
            </button>
          </div>
        </div>`;
      }).join('');

      // Click to open video watch page
      videos.forEach(v => {
        const thumb = document.getElementById('thumb-' + v.id);
        if (thumb) {
          thumb.addEventListener('click', () => {
            window.location.href = `videowatch.html?id=${encodeURIComponent(v.id)}`;
          });
        }
      });
    }

    function handleLike(id) {
      const btn = document.getElementById('like-btn-' + id);
      const countEl = document.getElementById('like-count-' + id);
      if (likedVideos.has(id)) {
        likedVideos.delete(id);
        Storage.videos.unlike(id);
        btn.classList.remove('liked');
        btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
      } else {
        likedVideos.add(id);
        Storage.videos.like(id);
        btn.classList.add('liked');
        btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
      }
      saveLiked();
      const v = Storage.videos.get(id);
      if (v && countEl) countEl.textContent = fmtNum(v.likes || 0);
    }

    function handleShare(id, title, url) {
      if (navigator.share) {
        navigator.share({ title: 'TechSarge: ' + title, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          tsToast('Link copied to clipboard!');
        }).catch(() => {
          tsToast('Share: ' + url);
        });
      }
    }

    Storage.ready.then(renderVideos);
    Storage.subscribe('videos', renderVideos);
  </script>
</body>
</html>
